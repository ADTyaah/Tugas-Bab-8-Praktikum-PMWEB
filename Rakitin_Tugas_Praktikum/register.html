<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Rakitin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-logo">Rakitin<span>.</span></div>
    <p class="auth-subtitle">Sewa alat, tinggal pakai.</p>

    <div class="auth-box">
        <h1>Buat Akun</h1>
        <p>Daftar untuk mulai menggunakan Rakitin.</p>

        <form id="registerForm">
            <label>Email
                <input id="regEmail" type="email" placeholder="Masukkan email" required>
            </label>
            <label>Username
                <input id="regUsername" type="text" placeholder="Masukkan username" required>
            </label>
            <label>Password
                <input id="regPassword" type="password" placeholder="Minimal 6 karakter" required>
            </label>
            <p id="formError" class="form-error" role="alert"></p>
            <button type="submit">Daftar Sekarang</button>
        </form>

        <p class="switch">Sudah punya akun? <a href="login.html">Login</a></p>
    </div>

    <footer><b>© Rakitin 2026</b></footer>
</div>
<script src="auth.js"></script>
</body>
</html>
